[project]
name = "django-tasks-pubsub"
version = "v0.1.1"
description = "Django tasks backend for Google Cloud Pub/Sub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.5",
    "google-cloud-pubsub>=2.38.0",
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "coverage>=7.14.0",
    "mypy>=2.1.0",
    "ruff>=0.15.13",
]
